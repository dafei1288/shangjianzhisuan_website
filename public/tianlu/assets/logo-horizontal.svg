<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <filter id="drybrush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55 0.45" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="seal-worn" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="4" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>

  <!-- 墨环飞鹭图标 -->
  <g transform="translate(8,8) scale(0.7667)">
    <path d="M 192.4 47.6 A 88 88 0 1 0 206.8 82.4" fill="none"
          stroke="#F4EEE1" stroke-width="7" stroke-linecap="round" filter="url(#drybrush)"/>
    <g transform="translate(55,55) scale(0.6)" fill="none" stroke="#F4EEE1" stroke-linecap="round" filter="url(#drybrush)">
      <path d="M98 138 C 108 96, 142 62, 198 46" stroke-width="14"/>
      <path d="M170 60 C 182 53, 194 48, 202 46" stroke-width="5"/>
      <path d="M100 140 C 88 102, 66 78, 32 62" stroke-width="9"/>
      <path d="M34 148 C 66 152, 112 142, 152 128" stroke-width="11"/>
      <path d="M150 128 C 164 124, 174 118, 178 106" stroke-width="7"/>
      <circle cx="184" cy="101" r="6" fill="#F4EEE1" stroke="none"/>
      <path d="M188 100 C 197 96, 205 93, 214 91" stroke-width="3.2"/>
      <path d="M36 150 C 24 154, 14 158, 2 164" stroke-width="3.2"/>
      <path d="M38 156 C 26 161, 16 166, 5 172" stroke-width="2.6"/>
    </g>
  </g>

  <!-- 中文主字标 -->
  <text x="232" y="118" font-family="'Noto Serif SC','Source Han Serif SC',STSong,SimSun,serif"
        font-size="86" font-weight="600" letter-spacing="16" fill="#F4EEE1">天鹭</text>

  <!-- 英文辅标 -->
  <text x="236" y="162" font-family="Georgia,'Times New Roman',serif"
        font-size="21" letter-spacing="11" fill="#C8A45C">TIANLU</text>

  <!-- 朱砂印章 -->
  <g transform="translate(458,52) rotate(-3)" filter="url(#seal-worn)">
    <rect x="0" y="0" width="54" height="54" rx="8" fill="#C03A2B"/>
    <text x="27" y="40" text-anchor="middle" font-family="STKaiti,KaiTi,STSong,SimSun,serif"
          font-size="35" fill="#F4EEE1">鹭</text>
  </g>
</svg>
