<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#FAF6EF"/>
  <rect x="24" y="24" width="1152" height="582" rx="22" fill="none" stroke="#E7DFD2" stroke-width="1.5"/>

  <!-- left title -->
  <g font-family="'JetBrains Mono','Microsoft YaHei',monospace">
    <rect x="70" y="140" width="270" height="34" rx="17" fill="#FFF1E6" stroke="#F5C9A8"/>
    <circle cx="92" cy="157" r="4" fill="#EA580C"/>
    <text x="106" y="162" font-size="13" fill="#EA580C" letter-spacing="2">MODULE 2 · PRODUCTIVITY</text>
  </g>
  <text x="70" y="248" font-family="Georgia,'Noto Serif SC','Microsoft YaHei',serif" font-size="56" font-weight="900" fill="#1C1917">D4 · 自动化</text>
  <rect x="70" y="264" width="180" height="6" rx="3" fill="#CA8A04" opacity=".45"/>
  <text x="70" y="312" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#57534E">SOP 提示词 = 不编程的自动化</text>
  <text x="70" y="340" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#57534E">3 个 AI 助手，今天上岗</text>
  <text x="70" y="566" font-family="'JetBrains Mono',monospace" font-size="11" fill="#A8A29E" letter-spacing="2">6 天 AI 工作台实战营 · COURSE 16</text>

  <!-- right: three assistant ID cards -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <!-- 纪要整理官 -->
    <g transform="translate(500,88)">
      <rect width="630" height="128" rx="16" fill="#FFFFFF" stroke="#E7DFD2"/>
      <rect x="22" y="36" width="56" height="56" rx="28" fill="#FFF1E6" stroke="#F5C9A8"/>
      <text x="50" y="73" text-anchor="middle" font-size="26">🤖</text>
      <text x="98" y="40" font-size="19" font-weight="700" fill="#1C1917">纪要整理官</text>
      <text x="98" y="62" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#A8A29E" letter-spacing="1">MEETING SECRETARY</text>
      <text x="98" y="92" font-size="13" fill="#57534E">输入：会议转写　→　输出：纪要 + 待办表格</text>
      <rect x="536" y="49" width="72" height="30" rx="15" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="572" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">SOP ✓</text>
    </g>
    <!-- 资料归档官 -->
    <g transform="translate(500,240)">
      <rect width="630" height="128" rx="16" fill="#FFFFFF" stroke="#E7DFD2"/>
      <rect x="22" y="36" width="56" height="56" rx="28" fill="#FFF1E6" stroke="#F5C9A8"/>
      <text x="50" y="73" text-anchor="middle" font-size="26">🗂️</text>
      <text x="98" y="40" font-size="19" font-weight="700" fill="#1C1917">资料归档官</text>
      <text x="98" y="62" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#A8A29E" letter-spacing="1">ARCHIVIST</text>
      <text x="98" y="92" font-size="13" fill="#57534E">输入：散乱文件清单　→　输出：四层目录归档位置</text>
      <rect x="536" y="49" width="72" height="30" rx="15" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="572" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">SOP ✓</text>
    </g>
    <!-- 数据快读官 -->
    <g transform="translate(500,392)">
      <rect width="630" height="128" rx="16" fill="#FFFFFF" stroke="#E7DFD2"/>
      <rect x="22" y="36" width="56" height="56" rx="28" fill="#FFF1E6" stroke="#F5C9A8"/>
      <text x="50" y="73" text-anchor="middle" font-size="26">📊</text>
      <text x="98" y="40" font-size="19" font-weight="700" fill="#1C1917">数据快读官</text>
      <text x="98" y="62" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#A8A29E" letter-spacing="1">DATA READER</text>
      <text x="98" y="92" font-size="13" fill="#57534E">输入：一张表格　→　输出：3 条结论 + 1 条异常提醒</text>
      <rect x="536" y="49" width="72" height="30" rx="15" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="572" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">SOP ✓</text>
    </g>
  </g>
</svg>
